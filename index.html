<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPACT LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#08111e;color:#e9f5ff;font:15px system-ui}header{padding:20px;border-bottom:1px solid #29425b}h1{margin:0;letter-spacing:3px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px}aside{background:#122238;border:1px solid #35516d;border-radius:12px;padding:20px}label{display:block;margin:18px 0 8px;color:#bed5eb}input,select,button{width:100%}input{accent-color:#51dcf5}select,button{padding:12px;border-radius:8px;border:1px solid #456780;background:#203650;color:white}button{margin-top:12px;background:#0788a8;font-weight:700;cursor:pointer}canvas{display:block;width:100%;height:auto;background:#091827;border:1px solid #35516d;border-radius:12px}.metric{display:flex;justify-content:space-between;margin-top:14px}small,p{color:#a5bbce}p{line-height:1.6}@media(max-width:760px){.layout{grid-template-columns:1fr}header h1{font-size:23px}}</style><header><h1>IMPACT LAB <small> / MATERIAL TEST</small></h1></header><div class="layout"><aside><b>실험 제어 패널</b><label>발사체 유형</label><select id="type"><option value="ball">구형 충격체</option><option value="jet">가상 집중 에너지 제트</option></select><label>충돌 에너지 <span id="energyV">55</span>%</label><input id="energy" type="range" min="10" max="100" value="55"><label>철판 두께 <span id="thickV">45</span>%</label><input id="thick" type="range" min="10" max="100" value="45"><label>철판 경사 <span id="angleV">0</span>°</label><input id="angle" type="range" min="-35" max="35" value="0"><label>재생 속도</label><select id="speed"><option value=".35">슬로모션 ×0.35</option><option value="1">일반 ×1</option><option value="2">빠르게 ×2</option></select><button id="fire">▶ 실험 시작</button><button id="reset" style="background:#30445a">↺ 초기화</button><div class="metric">상태 <b id="status">대기</b></div><div class="metric">충격 전달 <b id="transfer">—</b></div><div class="metric">변형 정도 <b id="damage">—</b></div><p>교육용 추상 시각화. 실제 탄도·관통 수치를 계산하지 않음.</p></aside><main><canvas id="scene" width="1000" height="550"></canvas><canvas id="chart" width="1000" height="160" style="margin-top:12px"></canvas></main></div><script>
(function(){'use strict';const el=id=>document.getElementById(id),c=el('scene'),x=c.getContext('2d'),g=el('chart').getContext('2d');let t=0,running=false,finished=false,particles=[],history=[],last=0;['energy','thick','angle'].forEach(id=>el(id).addEventListener('input',()=>el(id+'V').textContent=el(id).value));function reset(){t=0;running=false;finished=false;particles=[];history=[];el('status').textContent='대기';el('transfer').textContent='—';el('damage').textContent='—';draw()}el('fire').addEventListener('click',()=>{reset();running=true;el('status').textContent='진행 중';draw()});el('reset').addEventListener('click',reset);function draw(){const E=+el('energy').value/100,T=+el('thick').value/100,A=+el('angle').value*Math.PI/180,jet=el('type').value==='jet',impact=t>=.66,progress=Math.max(0,Math.min(1,(t-.66)*2)),response=Math.min(1,E*(jet?1.15:1)/(.4+T*.9)),deform=impact?response*progress:0,cx=630,cy=275;x.clearRect(0,0,1000,550);x.strokeStyle='#1b3349';x.lineWidth=1;for(let i=0;i<1000;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,550);x.stroke()}for(let j=0;j<550;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(1000,j);x.stroke()}x.fillStyle='#9bb9d0';x.font='16px monospace';x.fillText('TEST CHAMBER // SIMULATED',30,36);x.fillText('TARGET / ALLOY PLATE',700,80);x.save();x.translate(cx,cy);x.rotate(A);let w=15+T*65;x.fillStyle='#7890a4';x.fillRect(-w/2,-175,w,350);x.fillStyle='#c3d6e5';x.fillRect(-w/2,-175,5,350);if(impact){x.strokeStyle='#ffae64';x.lineWidth=4;x.beginPath();x.ellipse(-w/2,0,8+deform*30,13+deform*36,0,0,Math.PI*2);x.stroke()}x.restore();let px=impact?cx-30:80+(cx-110)*Math.min(1,t/.66);if(!impact||jet){x.fillStyle=jet?'#60e6ff':'#ffd18c';x.shadowBlur=22;x.shadowColor=x.fillStyle;if(jet){x.fillRect(px-65,cy-3,75,6)}else{x.beginPath();x.arc(px,cy,11,0,Math.PI*2);x.fill()}x.shadowBlur=0}if(impact&&running&&Math.random()<.55){for(let i=0;i<3;i++)particles.push({x:cx-30,y:cy,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*10,life:1})}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.025;x.fillStyle='rgba(255,180,90,'+Math.max(0,p.life)+')';x.fillRect(p.x,p.y,4,4)});particles=particles.filter(p=>p.life>0);if(impact){x.strokeStyle='rgba(95,218,255,'+(1-progress)+')';for(let i=0;i<3;i++){x.beginPath();x.arc(cx,cy,progress*(65+i*60),0,Math.PI*2);x.stroke()}}x.fillStyle='#b2cee3';x.fillText('TIME '+t.toFixed(2)+' s',35,510);x.fillText('ENERGY INDEX '+Math.round(E*100),350,510);x.fillText('RESPONSE '+Math.round(deform*100)+'%',700,510);if(finished){el('transfer').textContent=Math.round(response*100)+'% (상대 지수)';el('damage').textContent=Math.round(deform*100)+'% (상대 지수)'}g.clearRect(0,0,1000,160);g.strokeStyle='#35506b';g.beginPath();g.moveTo(45,15);g.lineTo(45,135);g.lineTo(980,135);g.stroke();g.fillStyle='#b6d0e6';g.font='13px monospace';g.fillText('ENERGY INDEX / TIME',55,22);g.strokeStyle='#43d6ef';g.lineWidth=3;g.beginPath();history.forEach((p,i)=>{let xx=45+p.t/1.5*930,yy=135-p.v*105;i?g.lineTo(xx,yy):g.moveTo(xx,yy)});g.stroke()}function frame(now){let dt=last?Math.min((now-last)/1000,.05):0;last=now;if(running){t=Math.min(1.5,t+dt*Number(el('speed').value));let E=+el('energy').value/100,T=+el('thick').value/100,response=Math.min(1,E*(el('type').value==='jet'?1.15:1)/(.4+T*.9)),progress=Math.max(0,Math.min(1,(t-.66)*2));history.push({t,v:t>=.66?Math.max(0,E*(1-progress*response)):E});if(t>=1.5){running=false;finished=true;el('status').textContent='실험 완료'}}draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></html>
