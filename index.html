<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPACT LAB 3D Sandbox</title><style>*{box-sizing:border-box}body{margin:0;background:#080e18;color:#e7eff8;font:14px system-ui}header{padding:14px 20px;background:#121e30;border-bottom:1px solid #2c4660}h1{font-size:22px;letter-spacing:2px;margin:0}.app{display:grid;grid-template-columns:285px minmax(0,1fr);height:calc(100dvh - 60px)}aside{overflow:auto;padding:17px;background:#111e30;border-right:1px solid #30475d}label{display:block;margin:13px 0 5px;color:#b7c9db}input,select,button{width:100%}input{accent-color:#64cce7}select,button{padding:10px;background:#20344b;color:#fff;border:1px solid #3c5b77;border-radius:7px}button{margin-top:9px;background:#167e9c;font-weight:700;cursor:pointer}.muted{color:#91a7bc;font-size:12px;line-height:1.6}.stats{border-top:1px solid #30475d;margin-top:16px;padding-top:12px}#viewport{position:relative;min-height:400px;overflow:hidden}#viewport canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;bottom:14px;left:14px;background:#0b1423bd;padding:10px;border-radius:6px;pointer-events:none}strong{color:#7be0f9}@media(max-width:760px){.app{display:flex;flex-direction:column;height:auto}aside{order:2;border:0}#viewport{height:55dvh;min-height:330px;order:1}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>IMPACT LAB <span style="color:#68cce6">3D SANDBOX</span></h1></header><div class="app"><aside><b>샌드박스 설정</b><label>발사체</label><select id="ammo"><option value="ball">강철 구체</option><option value="ap">AP 형상체 (게임 모형)</option><option value="jet">집중 에너지 제트 (가상 연출)</option></select><label>충격 강도 <output id="powerO">70</output></label><input id="power" type="range" min="5" max="100" value="70"><label>강판 두께 <output id="thickO">45</output></label><input id="thick" type="range" min="10" max="100" value="45"><label>강판 기울기 <output id="tiltO">0</output>°</label><input id="tilt" type="range" min="-60" max="60" value="0"><label>충돌 위치 X <output id="xO">0</output></label><input id="x" type="range" min="-70" max="70" value="0"><label>충돌 위치 Y <output id="yO">0</output></label><input id="y" type="range" min="-70" max="70" value="0"><button id="shoot">▶ 발사</button><button id="new">새 강판 설치</button><button id="wire">와이어프레임 보기</button><div class="stats"><div>상태: <strong id="status">준비</strong></div><div>결과: <strong id="result">—</strong></div></div><p class="muted">마우스 드래그: 회전 / 휠: 확대<br>터치 드래그: 회전<br>실제 탄도·장갑 관통 성능을 예측하지 않는 3D 게임형 파괴 모형입니다.</p></aside><section id="viewport"><div id="hint">3D 메시 변형 · 실제 구멍 생성 · 파편 · 도탄</div></section></div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),root=$('viewport');const scene=new THREE.Scene();scene.background=new THREE.Color(0x091522);const camera=new THREE.PerspectiveCamera(48,1,.1,100);camera.position.set(6,4.5,9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(root.clientWidth,root.clientHeight);root.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.minDistance=4;controls.maxDistance=20;scene.add(new THREE.HemisphereLight(0xbfdfff,0x26334a,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(4,7,5);scene.add(light);const grid=new THREE.GridHelper(15,30,0x416078,0x1a3248);grid.position.y=-2.6;scene.add(grid);const plateGroup=new THREE.Group();scene.add(plateGroup);const metal=new THREE.MeshStandardMaterial({color:0x8da3b3,metalness:.75,roughness:.35,side:THREE.DoubleSide,flatShading:false});const edgeMat=new THREE.MeshStandardMaterial({color:0x40586b,metalness:.8,roughness:.4});let mesh,frame,impactMarks=[],shards=[],shot=null,clock=new THREE.Clock(),wire=false,anim=null;const N=65,half=2.25;const value=id=>Number($(id).value);['power','thick','tilt','x','y'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'O').textContent=$(id).value;if(id==='tilt')plateGroup.rotation.y=value('tilt')*Math.PI/180}));function createPlate(){while(plateGroup.children.length){const a=plateGroup.children[0];plateGroup.remove(a);a.geometry?.dispose()}impactMarks=[];const verts=[],uv=[],idx=[];for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){const u=i/N,v=j/N;verts.push((u-.5)*half*2,(v-.5)*half*2,0);uv.push(u,v)}for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i,b=a+1,c=a+N+1,d=c+1;idx.push(a,b,d,a,d,c)}const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geom.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geom.setIndex(idx);geom.computeVertexNormals();mesh=new THREE.Mesh(geom,metal.clone());plateGroup.add(mesh);const border=new THREE.Mesh(new THREE.BoxGeometry(half*2+.12,half*2+.12,.08+value('thick')*.004),edgeMat);border.material=edgeMat;border.visible=false;frame=border;const line=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(half*2,half*2,.06)),new THREE.LineBasicMaterial({color:0x6b8aa2}));plateGroup.add(line);plateGroup.rotation.y=value('tilt')*Math.PI/180;clearShots();$('status').textContent='준비';$('result').textContent='—'}function clearShots(){if(shot){scene.remove(shot);shot.geometry.dispose();shot=null}for(const p of shards){scene.remove(p.obj);p.obj.geometry.dispose()}shards=[];anim=null}function deform(x,y,power,hole){const pos=mesh.geometry.attributes.position;const idx=mesh.geometry.index;const rad=.45+power*.75;for(let i=0;i<pos.count;i++){const dx=pos.getX(i)-x,dy=pos.getY(i)-y,r=Math.hypot(dx,dy);const dent=Math.exp(-Math.pow(r/rad,2)*3);pos.setZ(i,pos.getZ(i)-dent*(.18+power*.72));}if(hole){const arr=idx.array,kept=[];const radius=.15+power*.25;for(let i=0;i<arr.length;i+=3){let ax=0,ay=0;for(let k=0;k<3;k++){ax+=pos.getX(arr[i+k])/3;ay+=pos.getY(arr[i+k])/3}if(Math.hypot(ax-x,ay-y)>radius)kept.push(arr[i],arr[i+1],arr[i+2])}mesh.geometry.setIndex(kept);const ring=new THREE.Mesh(new THREE.TorusGeometry(radius, .035,6,28),new THREE.MeshStandardMaterial({color:0x354b5c,metalness:.8,roughness:.45}));ring.position.set(x,y,-.13);plateGroup.add(ring)}pos.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.geometry.computeBoundingSphere()}function debris(x,y,count,back){for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.025+Math.random()*.065),new THREE.MeshStandardMaterial({color:Math.random()>.5?0xa6c2d1:0xf4a960,metalness:.5,roughness:.4}));const p=new THREE.Vector3(x,y,0);plateGroup.localToWorld(p);m.position.copy(p);scene.add(m);const dir=new THREE.Vector3((Math.random()-.5)*3,(Math.random()-.5)*3,(back?-1:1)*(1+Math.random()*4)).applyQuaternion(plateGroup.quaternion);shards.push({obj:m,vel:dir,life:1+Math.random()*.7})}}function launch(){if(anim)return;clearShots();const x=value('x')/100*half*1.6,y=value('y')/100*half*1.6,power=value('power')/100,resist=value('thick')/100,tilt=Math.abs(value('tilt'))/60,type=$('ammo').value;const score=power-(resist*.65+tilt*.28);const ricochet=type!=='jet'&&tilt>.58&&score<.18;const hole=!ricochet&&score>(type==='jet'?.02:.12);const local=new THREE.Vector3(x,y,0),world=plateGroup.localToWorld(local.clone());const normal=new THREE.Vector3(0,0,1).applyQuaternion(plateGroup.quaternion);const start=world.clone().addScaledVector(normal,5);shot=type==='ball'?new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),new THREE.MeshStandardMaterial({color:0xd5b78d,metalness:.8,roughness:.25})):new THREE.Mesh(new THREE.ConeGeometry(type==='jet'?.045:.11,type==='jet'?1.2:.42,12),new THREE.MeshStandardMaterial({color:type==='jet'?0x6deaff:0xc2cbd4,emissive:type==='jet'?0x258ba0:0x000000,metalness:.55,roughness:.3}));if(type!=='ball')shot.rotation.x=Math.PI/2;scene.add(shot);shot.position.copy(start);anim={world,normal,start,x,y,power,ricochet,hole,type,t:0,collided:false};$('status').textContent='발사 중';$('result').textContent='—'}function tick(dt){if(anim){const a=anim;a.t+=dt;const travel=Math.min(1,a.t/1.2);if(!a.collided){shot.position.lerpVectors(a.start,a.world,travel);if(travel>=1){a.collided=true;deform(a.x,a.y,a.power,a.hole);debris(a.x,a.y,25+a.power*40|0,a.hole);$('result').textContent=a.ricochet?'도탄':a.hole?'구멍 생성':'함몰';$('status').textContent='충돌 완료'}}else{if(a.ricochet)shot.position.addScaledVector(new THREE.Vector3(1,.5,1).normalize(),dt*4);else if(a.hole)shot.position.addScaledVector(a.normal,-dt*4);else shot.visible=false;if(a.t>2.5){scene.remove(shot);shot.geometry.dispose();shot=null;anim=null;$('status').textContent='다음 발사 가능'}}}for(const s of shards){s.obj.position.addScaledVector(s.vel,dt);s.vel.y-=dt*3;s.obj.rotation.x+=dt*5;s.life-=dt}shards=shards.filter(s=>{if(s.life<=0){scene.remove(s.obj);s.obj.geometry.dispose();return false}return true})}function resize(){const w=root.clientWidth,h=root.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);$('shoot').addEventListener('click',launch);$('new').addEventListener('click',createPlate);$('wire').addEventListener('click',()=>{wire=!wire;mesh.material.wireframe=wire;$('wire').textContent=wire?'표면 보기':'와이어프레임 보기'});createPlate();function loop(){requestAnimationFrame(loop);tick(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera)}loop();
</script></body></html>
