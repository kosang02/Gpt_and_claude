<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMPACT LAB // PIXEL RANGE</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e17;color:#e6edf6;font:14px system-ui,sans-serif}header{padding:18px 22px;border-bottom:1px solid #25374c;background:#101b2b}h1{margin:0;font-size:24px;letter-spacing:3px}small,.muted{color:#8ea5bd}main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}.panel,.screen{border:1px solid #29415a;border-radius:10px;background:#121f30;padding:16px}label{display:block;margin:17px 0 5px;color:#b9cadb}select,input,button{width:100%}select,button{background:#21354a;color:white;border:1px solid #44617a;border-radius:7px;padding:11px}input{accent-color:#55c9e6}button{font-weight:700;cursor:pointer;background:#137d9e;margin-top:10px}button:active{transform:translateY(1px)}.secondary{background:#304054}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #283e52;padding:9px 0}.stat strong{color:#86e3fa}.screen{padding:10px;min-width:0}canvas{width:100%;height:auto;display:block;background:#0a1421;image-rendering:pixelated}#world{border:1px solid #36516b}#graph{margin-top:10px;border:1px solid #304a63}#log{padding:10px;color:#b9d2e4;min-height:42px}footer{padding:8px 18px;color:#8da1b8;font-size:12px}@media(max-width:780px){main{grid-template-columns:1fr}header h1{font-size:20px}}
</style></head><body><header><h1>IMPACT LAB <small>// PIXEL RANGE v2</small></h1></header><main><section class="panel"><strong>시험 제어</strong><label>발사체</label><select id="ammo"><option value="ap">AP · 운동 충격체</option><option value="heat">HEAT · 성형작약탄 (연출)</option></select><label>충격 강도 <output id="powerOut">60</output></label><input id="power" type="range" min="10" max="100" value="60"><label>철판 저항 <output id="armorOut">55</output></label><input id="armor" type="range" min="10" max="100" value="55"><label>철판 경사 <output id="tiltOut">30°</output></label><input id="tilt" type="range" min="-65" max="65" value="30"><label>재생 속도</label><select id="rate"><option value=".35">0.35× 슬로모션</option><option value="1" selected>1× 보통</option><option value="2">2× 빠르게</option></select><button id="fire">▶ 실험 시작</button><button class="secondary" id="reset">↻ 장면 초기화</button><div class="stat"><span>상태</span><strong id="state">대기</strong></div><div class="stat"><span>판정</span><strong id="result">—</strong></div><div class="stat"><span>손상 지수</span><strong id="damage">—</strong></div><p class="muted">시각 효과 및 판정은 게임용 임의 규칙입니다. 실제 탄도·방호 성능과 무관합니다.</p></section><section class="screen"><canvas id="world" width="960" height="520"></canvas><canvas id="graph" width="960" height="120"></canvas><div id="log" role="status" aria-live="polite">준비 완료. 실험 시작을 누르세요.</div></section></main><footer>Pixel-based impact visualization · educational arcade model · no real-world penetration prediction</footer><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d'),graph=$('graph').getContext('2d');let elapsed=0,playing=false,hit=false,ended=false,projectile={x:90,y:260,vx:390,vy:0},pieces=[],sparks=[],waves=[],trace=[],outcome='',damage=0,angle=0,plate=0,thickness=0,ammo='ap',strength=0,seed=1,last=0;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const setText=(id,s)=>$(id).textContent=s;function sync(){for(const [id,suffix] of [['power',''],['armor',''],['tilt','°']])setText(id+'Out',$(id).value+suffix)}['power','armor','tilt'].forEach(id=>$(id).addEventListener('input',()=>{sync();if(!playing&&!ended)draw()}));function configure(){ammo=$('ammo').value;strength=Number($('power').value)/100;thickness=Number($('armor').value)/100;angle=Number($('tilt').value)*Math.PI/180;plate=600;seed=2027;elapsed=0;playing=false;hit=false;ended=false;outcome='';damage=0;projectile={x:95,y:260,vx:400,vy:0};pieces=[];sparks=[];waves=[];trace=[];setText('state','대기');setText('result','—');setText('damage','—');setText('log','준비 완료. 실험 시작을 누르세요.')}function start(){configure();playing=true;setText('state','진행 중');setText('log',ammo==='ap'?'AP 충격체 발사':'성형작약탄 시각 효과 시작')}function addParticle(x,y,vx,vy,color,size,life){pieces.push({x,y,vx,vy,color,size,life,max:life})}function burst(x,y,n,kind){for(let i=0;i<n;i++){const a=rand()*Math.PI*2,s=45+rand()*260;addParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,kind==='metal'?'#a8c6d6':(rand()>.5?'#ffcb69':'#ff6b43'),2+rand()*4,.25+rand()*.8)}}function collide(){hit=true;const a=Math.abs(angle),resist=thickness*.85+a*.38;const score=strength-(resist*.75);damage=Math.max(5,Math.min(99,Math.round((strength/(.3+resist))*43)));if(ammo==='ap'){outcome=(a>.55&&score<.28)?'도탄':score>.24?'관통 연출':'철판에 정지';burst(plate,260,35,'metal');burst(plate-10,260,45,'fire');if(outcome==='도탄'){projectile.vx=-240;projectile.vy=angle>=0?-240:240;setText('log','충돌! 충격체가 표면에서 튕겨 나갑니다.')}else if(outcome==='관통 연출'){projectile.vx=210;projectile.vy=0;burst(plate+40,260,26,'metal');setText('log','충돌! 후면으로 파편이 퍼지는 연출.')}else{projectile.vx=0;setText('log','충돌! 충격체가 멈추고 철판이 변형됩니다.')}}else{outcome=score>.02?'제트 관통 연출':'제트 소멸';projectile.vx=0;burst(plate-8,260,75,'fire');burst(plate+12,260,30,'metal');setText('log',outcome==='제트 관통 연출'?'충돌! 빛나는 제트와 후면 파편이 생성됩니다.':'충돌! 제트가 철판 표면에서 소멸합니다.')}waves.push({x:plate,y:260,r:2,life:.8});setText('result',outcome);setText('damage',damage+' / 100')}function update(dt){if(!playing)return;elapsed+=dt;const step=dt*Number($('rate').value);if(!hit){projectile.x+=projectile.vx*step;if(projectile.x>=plate-15)collide()}else{projectile.x+=projectile.vx*step;projectile.y+=projectile.vy*step;if(ammo==='heat'&&outcome==='제트 관통 연출'&&elapsed<2.2&&rand()<.9)for(let i=0;i<3;i++)addParticle(plate+rand()*125,260+(rand()-.5)*13,120+rand()*180,(rand()-.5)*40,'#8ef6ff',2, .2+rand()*.35)}for(const p of pieces){p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=140*step;p.life-=step}pieces=pieces.filter(p=>p.life>0);for(const w of waves){w.r+=220*step;w.life-=step}waves=waves.filter(w=>w.life>0);trace.push({t:elapsed,y:hit?damage:0});if(elapsed>3.4){playing=false;ended=true;setText('state','완료')}}function line(x1,y1,x2,y2,color,w=1){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function draw(){ctx.fillStyle='#0a1421';ctx.fillRect(0,0,960,520);for(let x=0;x<960;x+=24)line(x,0,x,520,'#16283a');for(let y=0;y<520;y+=24)line(0,y,960,y,'#16283a');ctx.fillStyle='#7f9eb7';ctx.font='16px monospace';ctx.fillText('CHAMBER 01 / PIXEL COLLISION',25,32);ctx.fillText('STEEL TARGET',660,72);ctx.fillText('TIME '+elapsed.toFixed(2)+' s',28,490);ctx.fillText('ARCADE PHYSICS',720,490);ctx.fillStyle='#293a4c';ctx.fillRect(0,410,960,9);for(let i=0;i<20;i++)ctx.fillRect(i*50,420,27,4);ctx.save();ctx.translate(plate,260);ctx.rotate(angle);const w=18+thickness*54;ctx.fillStyle='#384a5c';ctx.fillRect(-w/2-5,-156,w+10,312);ctx.fillStyle='#7896a8';ctx.fillRect(-w/2,-156,w,312);ctx.fillStyle='#b9d1df';ctx.fillRect(-w/2,-156,5,312);for(let i=-140;i<150;i+=16){ctx.fillStyle='#59798b';ctx.fillRect(-w/2+9,i,w-18,2)}if(hit){ctx.fillStyle='#263644';ctx.beginPath();ctx.ellipse(-w/2,0,6+damage*.24,10+damage*.32,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e5b781';ctx.lineWidth=3;ctx.stroke();if(outcome==='관통 연출'||outcome==='제트 관통 연출'){ctx.fillStyle='#101c29';ctx.fillRect(-w/2,-5-damage*.09,w,10+damage*.18)}}ctx.restore();if(!hit||ammo==='ap'){ctx.save();ctx.translate(projectile.x,projectile.y);if(hit&&outcome==='도탄')ctx.rotate(Math.atan2(projectile.vy,projectile.vx));ctx.fillStyle='#e9b875';ctx.fillRect(-22,-5,31,10);ctx.fillStyle='#dfe6eb';ctx.fillRect(9,-3,12,6);ctx.restore()}if(hit&&ammo==='heat'){ctx.globalCompositeOperation='lighter';ctx.fillStyle='#7ae7ff';for(let i=0;i<8;i++){let len=outcome==='제트 관통 연출'?Math.min(190,elapsed*75):35;ctx.globalAlpha=.18+rand()*.4;ctx.fillRect(plate-10,258+(rand()-.5)*14,len,1+rand()*3)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}for(const p of pieces){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;for(const w of waves){ctx.strokeStyle='rgba(119,215,255,'+Math.max(0,w.life)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke()}graph.fillStyle='#0a1421';graph.fillRect(0,0,960,120);graph.strokeStyle='#36516b';graph.beginPath();graph.moveTo(38,12);graph.lineTo(38,99);graph.lineTo(945,99);graph.stroke();graph.fillStyle='#9bb8ce';graph.font='13px monospace';graph.fillText('DAMAGE INDEX',50,20);graph.strokeStyle='#70e0f7';graph.lineWidth=2;graph.beginPath();trace.forEach((p,i)=>{let xx=38+Math.min(1,p.t/3.4)*900,yy=99-p.y*.75;i?graph.lineTo(xx,yy):graph.moveTo(xx,yy)});graph.stroke()}$('fire').addEventListener('click',start);$('reset').addEventListener('click',()=>{configure();draw()});$('ammo').addEventListener('change',()=>{configure();draw()});function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;update(dt);draw();requestAnimationFrame(frame)}sync();configure();requestAnimationFrame(frame)})();
</script></body></html>
